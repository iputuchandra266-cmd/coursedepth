<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" fill="none" role="img" aria-label="Premium online course dashboard illustration">
  <defs>
    <!-- glass surfaces -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".07"/>
    </linearGradient>
    <!-- course thumbnail -->
    <linearGradient id="thumb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c1676"/>
      <stop offset=".55" stop-color="#5326c9"/>
      <stop offset="1" stop-color="#9061f9"/>
    </linearGradient>
    <!-- champagne gold accent -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffeaa8"/>
      <stop offset=".5" stop-color="#ffc900"/>
      <stop offset="1" stop-color="#e0a400"/>
    </linearGradient>
    <!-- ambient halos -->
    <radialGradient id="haloGold" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffc900" stop-opacity=".50"/>
      <stop offset="1" stop-color="#ffc900" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloViolet" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity=".35"/>
      <stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
    <!-- dot grid texture -->
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" opacity=".25"/>
    </pattern>
    <!-- depth -->
    <filter id="sh" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#12062e" flood-opacity=".45"/>
    </filter>
    <filter id="sh2" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#12062e" flood-opacity=".40"/>
    </filter>
    <!-- reusable 5-point star (r = 7) -->
    <path id="star" d="M0-7 1.57-2.16 6.66-2.16 2.54.83 4.12 5.66 0 2.67-4.12 5.66-2.54.83-6.66-2.16-1.57-2.16Z"/>
  </defs>

  <!-- ===== ambient ===== -->
  <circle cx="556" cy="64" r="96" fill="url(#haloGold)"/>
  <circle cx="72" cy="372" r="130" fill="url(#haloViolet)"/>
  <circle cx="556" cy="64" r="86" fill="none" stroke="url(#gold)" stroke-width="2" opacity=".45"/>
  <rect x="418" y="170" width="222" height="180" rx="24" fill="url(#dots)" opacity=".8"/>
  <path d="M0 372 Q0 316 56 316 L118 316 Q174 316 174 372 L174 440 L0 440 Z" fill="#ffffff" opacity=".08"/>

  <!-- ===== main course card ===== -->
  <g filter="url(#sh)">
    <rect x="64" y="92" width="372" height="280" rx="26" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".35"/>
    <circle cx="92" cy="120" r="5.5" fill="url(#gold)"/>
    <circle cx="111" cy="120" r="5.5" fill="#ffffff" opacity=".55"/>
    <circle cx="130" cy="120" r="5.5" fill="#ffffff" opacity=".30"/>
    <rect x="336" y="110" width="76" height="20" rx="10" fill="#ffffff" opacity=".14"/>
    <circle cx="348" cy="120" r="4" fill="url(#gold)"/>
    <rect x="358" y="116" width="42" height="8" rx="4" fill="#ffffff" opacity=".7"/>

    <!-- player thumbnail -->
    <rect x="88" y="144" width="324" height="150" rx="16" fill="url(#thumb)"/>
    <rect x="88" y="144" width="324" height="150" rx="16" fill="none" stroke="#ffffff" stroke-opacity=".25"/>
    <circle cx="250" cy="219" r="30" fill="#ffffff" opacity=".96"/>
    <path d="M241 205l24 14-24 14z" fill="#4a1fd0"/>
    <rect x="104" y="276" width="292" height="7" rx="3.5" fill="#ffffff" opacity=".35"/>
    <rect x="104" y="276" width="178" height="7" rx="3.5" fill="url(#gold)"/>

    <!-- title block -->
    <rect x="88" y="310" width="238" height="14" rx="7" fill="#ffffff" opacity=".92"/>
    <rect x="88" y="333" width="164" height="10" rx="5" fill="#ffffff" opacity=".5"/>
    <g fill="url(#gold)">
      <path transform="translate(356 317)" d="M0-7 1.57-2.16 6.66-2.16 2.54.83 4.12 5.66 0 2.67-4.12 5.66-2.54.83-6.66-2.16-1.57-2.16Z"/>
      <path transform="translate(376 317)" d="M0-7 1.57-2.16 6.66-2.16 2.54.83 4.12 5.66 0 2.67-4.12 5.66-2.54.83-6.66-2.16-1.57-2.16Z"/>
      <path transform="translate(396 317)" d="M0-7 1.57-2.16 6.66-2.16 2.54.83 4.12 5.66 0 2.67-4.12 5.66-2.54.83-6.66-2.16-1.57-2.16Z"/>
    </g>

    <!-- progress -->
    <rect x="88" y="352" width="324" height="9" rx="4.5" fill="#ffffff" opacity=".18"/>
    <rect x="88" y="352" width="206" height="9" rx="4.5" fill="url(#gold)"/>
  </g>

  <!-- ===== floating graduation cap ===== -->
  <g filter="url(#sh2)">
    <path d="M300 38l66 28-66 28-66-28z" fill="url(#gold)"/>
    <path d="M264 80l36 16 36-16v22c0 12-16 21-36 21s-36-9-36-21z" fill="#ffffff" opacity=".92"/>
    <path d="M366 66v26" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="366" cy="96" r="5.5" fill="url(#gold)"/>
  </g>

  <!-- ===== verified badge pill ===== -->
  <g filter="url(#sh2)">
    <rect x="52" y="40" width="140" height="40" rx="20" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".35"/>
    <circle cx="76" cy="60" r="9" fill="url(#gold)"/>
    <path d="M71.6 60.4l3 3.1 5.6-6.3" stroke="#3a1f8f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="94" y="50" width="82" height="9" rx="4.5" fill="#ffffff" opacity=".9"/>
    <rect x="94" y="65" width="56" height="8" rx="4" fill="#ffffff" opacity=".5"/>
  </g>

  <!-- ===== rating card ===== -->
  <g filter="url(#sh2)">
    <rect x="444" y="44" width="152" height="108" rx="20" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".35"/>
    <g fill="url(#gold)">
      <path transform="translate(476 76)" d="M0-7 1.57-2.16 6.66-2.16 2.54.83 4.12 5.66 0 2.67-4.12 5.66-2.54.83-6.66-2.16-1.57-2.16Z"/>
      <path transform="translate(498 76)" d="M0-7 1.57-2.16 6.66-2.16 2.54.83 4.12 5.66 0 2.67-4.12 5.66-2.54.83-6.66-2.16-1.57-2.16Z"/>
      <path transform="translate(520 76)" d="M0-7 1.57-2.16 6.66-2.16 2.54.83 4.12 5.66 0 2.67-4.12 5.66-2.54.83-6.66-2.16-1.57-2.16Z"/>
      <path transform="translate(542 76)" d="M0-7 1.57-2.16 6.66-2.16 2.54.83 4.12 5.66 0 2.67-4.12 5.66-2.54.83-6.66-2.16-1.57-2.16Z"/>
      <path transform="translate(564 76)" d="M0-7 1.57-2.16 6.66-2.16 2.54.83 4.12 5.66 0 2.67-4.12 5.66-2.54.83-6.66-2.16-1.57-2.16Z"/>
    </g>
    <rect x="466" y="98" width="108" height="10" rx="5" fill="#ffffff" opacity=".85"/>
    <rect x="466" y="116" width="70" height="9" rx="4.5" fill="#ffffff" opacity=".45"/>
  </g>

  <!-- ===== gold achievement chip ===== -->
  <g filter="url(#sh2)">
    <rect x="448" y="306" width="156" height="84" rx="20" fill="url(#gold)"/>
    <circle cx="490" cy="348" r="26" fill="none" stroke="#3a1f8f" stroke-opacity=".25" stroke-width="8"/>
    <path d="M490 322a26 26 0 1 1-22 39" fill="none" stroke="#3a1f8f" stroke-width="8" stroke-linecap="round"/>
    <rect x="528" y="334" width="58" height="11" rx="5.5" fill="#2c1676" opacity=".9"/>
    <rect x="528" y="354" width="40" height="10" rx="5" fill="#2c1676" opacity=".55"/>
  </g>

  <!-- ===== sparkle & details ===== -->
  <path transform="translate(614 214)" fill="url(#gold)" d="M0-16C2-6 6-2 16 0 6 2 2 6 0 16-2 6-6 2-16 0-6-2-2-6 0-16Z"/>
  <path transform="translate(38 150) scale(.55)" fill="url(#gold)" d="M0-16C2-6 6-2 16 0 6 2 2 6 0 16-2 6-6 2-16 0-6-2-2-6 0-16Z"/>
  <circle cx="624" cy="140" r="6" fill="#ffffff" opacity=".55"/>
  <circle cx="446" cy="246" r="5" fill="#ffffff" opacity=".5"/>
  <circle cx="26" cy="120" r="6" fill="#ffffff" opacity=".35"/>
  <path d="M196 424c60-40 140-56 220-40" stroke="url(#gold)" stroke-width="2" opacity=".5" fill="none"/>
</svg>
